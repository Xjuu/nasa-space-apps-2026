<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">FireSpot architecture</title>
  <desc id="d">Data sources feed an aggregation grid, which feeds models, which are served by a FastAPI backend to a web app.</desc>
  <style>
    .box{fill:#ffffff;stroke:#145c64;stroke-width:1.5}
    .src{fill:#f3f6f7;stroke:#5b6b73;stroke-width:1.2}
    .col{font-size:13px;font-weight:700;fill:#145c64;letter-spacing:.06em}
    .h{font-size:14px;font-weight:700;fill:#1d2b34}
    .s{font-size:12px;fill:#1d2b34}
    .n{font-size:11px;fill:#5b6b73}
    .arrow{stroke:#145c64;stroke-width:2;fill:none;marker-end:url(#ah)}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#145c64"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="20" y="28" class="h" font-size="18">FireSpot: data, aggregation grid, models, API, web app</text>

  <text x="20" y="62" class="col">1 DATA (keyless)</text>
  <text x="318" y="62" class="col">2 AGGREGATION GRID</text>
  <text x="560" y="62" class="col">3 MODELS</text>
  <text x="862" y="62" class="col">4 API</text>
  <text x="1010" y="62" class="col">5 WEB APP</text>

  <!-- column 1 sources -->
  <g>
    <rect class="src" x="20" y="74" width="270" height="62" rx="6"/><text x="30" y="94" class="h">NASA FIRMS archive</text><text x="30" y="112" class="s">MODIS 2000-, S-NPP 2012-, NOAA-20 2018-</text><text x="30" y="127" class="n">per-country CSVs (download_country.py)</text>
    <rect class="src" x="20" y="146" width="270" height="52" rx="6"/><text x="30" y="166" class="h">FIRMS NRT 7-day feeds</text><text x="30" y="184" class="s">NOAA-20, NOAA-21, MODIS (live alerts)</text>
    <rect class="src" x="20" y="208" width="270" height="62" rx="6"/><text x="30" y="228" class="h">Weather</text><text x="30" y="246" class="s">Open-Meteo (ERA5, forecast), NOAA GFS</text><text x="30" y="261" class="n">NOAA NCEP reanalysis (research only)</text>
    <rect class="src" x="20" y="280" width="270" height="76" rx="6"/><text x="30" y="300" class="h">Landscape</text><text x="30" y="318" class="s">ESA WorldCover, Copernicus DEM GLO-30,</text><text x="30" y="333" class="s">OSM (Overpass), Sentinel-2 (Earth Search)</text><text x="30" y="348" class="n">fuel, slope, firebreaks, dryness</text>
    <rect class="src" x="20" y="366" width="270" height="52" rx="6"/><text x="30" y="386" class="h">Orbits and GOES</text><text x="30" y="404" class="s">CelesTrak TLE (SGP4), NOAA GOES (AWS)</text>
  </g>

  <!-- column 2 -->
  <rect class="box" x="318" y="74" width="214" height="196" rx="6"/>
  <text x="330" y="96" class="h">0.05 degree grid (~5.5 km)</text>
  <text x="330" y="116" class="s">1 row = 1 satellite overpass</text>
  <text x="330" y="132" class="s">over 1 cell: count, FRP, footprint,</text>
  <text x="330" y="148" class="s">brightness, confidence, time</text>
  <text x="330" y="172" class="s">cache/cells/*.parquet</text>
  <text x="330" y="188" class="s">cache/fireindex (memory-mapped)</text>
  <text x="330" y="204" class="s">cache/subcell (375 m positions)</text>
  <text x="330" y="220" class="s">cache/viirs_daily.parquet</text>
  <text x="330" y="236" class="s">viirs_equiv_daily (2008-2011)</text>
  <text x="330" y="256" class="n">equifire/collect.py, fastcache.py</text>

  <!-- column 3 models -->
  <g>
    <rect class="box" x="560" y="74" width="270" height="44" rx="6"/><text x="570" y="94" class="h">1 Size/FRP harmonization</text><text x="570" y="110" class="s">MODIS to VIIRS-equivalent (goal 1)</text>
    <rect class="box" x="560" y="124" width="270" height="44" rx="6"/><text x="570" y="144" class="h">2 MODIS-era reconstruction</text><text x="570" y="160" class="s">2008-2011 archive</text>
    <rect class="box" x="560" y="174" width="270" height="44" rx="6"/><text x="570" y="194" class="h">3 Spread ML (XGBoost, 1-3 d)</text><text x="570" y="210" class="s">walk-forward validated</text>
    <rect class="box" x="560" y="224" width="270" height="44" rx="6"/><text x="570" y="244" class="h">4+5 ML + physics blend, hourly sim</text><text x="570" y="260" class="s">Rothermel + landscape (experimental)</text>
    <rect class="box" x="560" y="274" width="270" height="44" rx="6"/><text x="570" y="294" class="h">6 1 km alerts</text><text x="570" y="310" class="s">precision-first</text>
    <rect class="box" x="560" y="324" width="270" height="44" rx="6"/><text x="570" y="344" class="h">7 Routine vs anomaly (rules)</text><text x="570" y="360" class="s">leave-one-year-out calendar (goal 4)</text>
    <rect class="box" x="560" y="374" width="270" height="44" rx="6"/><text x="570" y="394" class="h">8-10 Bow-tie clustering, live z-score,</text><text x="570" y="410" class="s">overpass countdown (goals 2, 3, 5)</text>
  </g>

  <!-- column 4 API -->
  <rect class="box" x="862" y="74" width="120" height="344" rx="6"/>
  <text x="872" y="96" class="h">FastAPI</text>
  <text x="872" y="114" class="s">backend/app.py</text>
  <text x="872" y="140" class="s">/fires /stats</text>
  <text x="872" y="156" class="s">/classify</text>
  <text x="872" y="172" class="s">/forecast</text>
  <text x="872" y="188" class="s">/predict</text>
  <text x="872" y="204" class="s">/predict/simulate</text>
  <text x="872" y="220" class="s">/simulate</text>
  <text x="872" y="236" class="s">/clusters</text>
  <text x="872" y="252" class="s">/geometry</text>
  <text x="872" y="268" class="s">/overpass</text>
  <text x="872" y="284" class="s">/live/alerts</text>
  <text x="872" y="300" class="s">/live/*.cap</text>
  <text x="872" y="324" class="n">port 8000</text>
  <text x="872" y="340" class="n">EQUIFIRE_LITE=1</text>
  <text x="872" y="356" class="n">= live only</text>

  <!-- column 5 web app -->
  <rect class="box" x="1010" y="74" width="170" height="344" rx="6"/>
  <text x="1020" y="96" class="h">Web app</text>
  <text x="1020" y="114" class="s">served at / by the</text>
  <text x="1020" y="130" class="s">backend (frontend/)</text>
  <text x="1020" y="160" class="s">Monitor</text>
  <text x="1020" y="178" class="s">Forecast + player</text>
  <text x="1020" y="196" class="s">History (calendar)</text>
  <text x="1020" y="214" class="s">Alerts (live, CAP)</text>
  <text x="1020" y="238" class="s">Satellite overlays</text>
  <text x="1020" y="256" class="s">GeoJSON / CAP export</text>
  <text x="1020" y="290" class="n">Leaflet + globe.gl</text>
  <text x="1020" y="306" class="n">Orbital UI at /orbital/</text>

  <!-- arrows -->
  <path class="arrow" d="M290 105 H316"/>
  <path class="arrow" d="M290 172 H304 V150 H316"/>
  <path d="M290 240 H304 M290 318 H304 M290 392 H304 M304 240 V392" stroke="#145c64" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <path class="arrow" d="M304 300 H556" stroke-dasharray="5 4"/>
  <text x="322" y="294" class="n">weather, landscape, orbits: on demand</text>
  <path class="arrow" d="M532 172 H558"/>
  <path class="arrow" d="M830 246 H860"/>
  <path class="arrow" d="M982 246 H1008"/>

  <!-- bottom notes -->
  <rect x="20" y="440" width="1160" height="170" rx="6" fill="#f3f6f7" stroke="#dce3e6"/>
  <text x="34" y="464" class="h">Reading the diagram</text>
  <text x="34" y="486" class="s">Weather, landscape, orbit and GOES sources are fetched on demand by the physics simulator and the live service and cached under cache/ and backend/.cache/.</text>
  <text x="34" y="506" class="s">The archive grid is built once per country (5 countries fully processed: Brazil, Australia, India, United States, Canada).</text>
  <text x="34" y="526" class="s">Every forecast in the app runs ML + physics together (/predict/simulate); there is no standalone fallback. Scores are uncalibrated.</text>
  <text x="34" y="546" class="s">Truth for all validation is VIIRS detections, which miss fires under cloud and smoke. See docs/MODEL_CARD.md for numbers and limits.</text>
  <text x="34" y="574" class="n">Research prototype. Not for operational decisions. Data credits: docs/DATA_SOURCES_AND_LICENSES.md</text>
</svg>
